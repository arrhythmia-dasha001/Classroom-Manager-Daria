<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="520" height="330" fill="#fff"/>
  <rect x="185" y="20" width="150" height="50" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="260" y="42" text-anchor="middle" font-weight="bold">App</text>
  <text x="260" y="60" text-anchor="middle" font-size="12">hat die Daten (products)</text>

  <line x1="260" y1="70" x2="260" y2="128" stroke="#1f2328" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="270" y="104" font-size="12" fill="#0969da">products</text>

  <rect x="185" y="130" width="150" height="50" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="260" y="152" text-anchor="middle" font-weight="bold">ProductList</text>
  <text x="260" y="170" text-anchor="middle" font-size="12">products.map(...)</text>

  <line x1="230" y1="180" x2="95" y2="248" stroke="#1f2328" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <line x1="260" y1="180" x2="260" y2="248" stroke="#1f2328" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <line x1="290" y1="180" x2="425" y2="248" stroke="#1f2328" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="70" y="212" font-size="12" fill="#0969da">name, price</text>

  <rect x="20" y="250" width="150" height="50" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="95" y="272" text-anchor="middle" font-weight="bold">ProductCard</text>
  <text x="95" y="290" text-anchor="middle" font-size="12">Tasse</text>
  <rect x="185" y="250" width="150" height="50" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="260" y="272" text-anchor="middle" font-weight="bold">ProductCard</text>
  <text x="260" y="290" text-anchor="middle" font-size="12">Becher groß</text>
  <rect x="350" y="250" width="150" height="50" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="425" y="272" text-anchor="middle" font-weight="bold">ProductCard</text>
  <text x="425" y="290" text-anchor="middle" font-size="12">… (12 Stück)</text>

  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#57606a">Daten fließen nur von oben nach unten (über Props)</text>
</svg>
