<svg xmlns="http://www.w3.org/2000/svg" width="680" height="408" viewBox="0 0 680 408"><rect width="680" height="408" fill="#fff"/>
<rect x="20" y="20" width="640" height="40" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#111">Energiekosten berechnen (1 Monat)</text>
<rect x="20" y="60" width="640" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="82.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">RABATT_GRENZE := 300   (kWh pro Monat)</text>
<rect x="20" y="94" width="640" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">RABATT_SATZ := 0,10   (10 % Rabatt)</text>
<rect x="20" y="128" width="640" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">Eingabe: verbrauch, preisProKWh, grundgebuehr</text>
<rect x="20" y="162" width="640" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">arbeitspreis := verbrauch × preisProKWh</text>
<rect x="20" y="196" width="640" height="56" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="20" y1="196" x2="480.79999999999995" y2="252" stroke="#111" stroke-width="1.5"/>
<line x1="660" y1="196" x2="480.79999999999995" y2="252" stroke="#111" stroke-width="1.5"/>
<text x="340.0" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">verbrauch ≥ RABATT_GRENZE ?</text>
<text x="28" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#111">ja</text>
<text x="652" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#111">nein</text>
<rect x="20" y="252" width="460.79999999999995" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">rabatt := arbeitspreis × RABATT_SATZ</text>
<rect x="20" y="286" width="460.79999999999995" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="308.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">arbeitspreis := arbeitspreis − rabatt</text>
<rect x="480.79999999999995" y="252" width="179.20000000000005" height="68" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="570.4" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">∅</text>
<rect x="20" y="320" width="640" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="342.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">gesamtkosten := arbeitspreis + grundgebuehr</text>
<rect x="20" y="354" width="640" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="30" y="376.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#111">Ausgabe: gesamtkosten</text>
</svg>